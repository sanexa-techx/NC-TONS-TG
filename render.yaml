services:
  - type: web
    name: nc-tons-backend
    env: node
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: ALLOW_DEV_AUTH
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: nc-tons-db
          property: connectionString
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_TELEGRAM_IDS
        sync: false
      - key: ADMIN_CHANNEL_ID
        sync: false
      - key: WEBAPP_URL
        sync: false

databases:
  - name: nc-tons-db
    plan: free
    databaseName: nctons
    user: nctons_user
    region: oregon
