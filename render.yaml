services:
  - type: web
    name: nc-tons-backend
    runtime: node
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "5000"
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_TELEGRAM_IDS
        value: "123456789"
      - key: ADMIN_CHANNEL_ID
        sync: false
      - key: WEBAPP_URL
        value: "https://nctons-tg.netlify.app"
      - key: ALLOW_DEV_AUTH
        value: "true"
      - key: NOTION_API_KEY
        sync: false
      - key: NOTION_WITHDRAWALS_DATABASE_ID
        sync: false
      - key: NOTION_TASKS_DATABASE_ID
        sync: false
