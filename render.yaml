# yaml-language-server: $schema=none
services:
  - type: web
    name: nctons-backend
    runtime: node
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: npm install --include=dev && npx prisma generate && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_TELEGRAM_IDS
        sync: false
      - key: ADMIN_CHANNEL_ID
        sync: false
      - key: PUBLIC_PAYOUT_CHANNEL_ID
        sync: false
      - key: WEBAPP_URL
        value: https://nctons-tg.netlify.app
      - key: ALLOW_DEV_AUTH
        value: "false"
      - key: NOTION_API_KEY
        sync: false
      - key: NOTION_WITHDRAWALS_DATABASE_ID
        sync: false
      - key: NOTION_TASKS_DATABASE_ID
        sync: false
